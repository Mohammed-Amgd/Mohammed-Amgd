<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Mohamed Amgd — software development, data and mathematics animated orbital banner</title>
<desc id="desc">Mohamed Amgd, Software Developer and Data Analyst, surrounded by animated icons for programming languages, web development, analytics, and development tools.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#08101d"/><stop offset=".55" stop-color="#112a46"/><stop offset="1" stop-color="#0b4975"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#137ba8"/><stop offset=".5" stop-color="#40d7ff"/><stop offset="1" stop-color="#0b679f"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#1e91ce" stop-opacity=".23"/><stop offset="1" stop-color="#1e91ce" stop-opacity="0"/></radialGradient>
 <linearGradient id="wave"><stop stop-color="#041122"/><stop offset="1" stop-color="#09608c"/></linearGradient>
 <filter id="glow" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#020812" flood-opacity=".9"/></filter>
 <style>
 .track{fill:none;stroke:url(#line);stroke-width:1.2;opacity:.32}
 .track.alt{stroke-dasharray:3 7;opacity:.18}
 .icon-disc{fill:#0b1f35;stroke-width:1.4}
 .glyph{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:800;text-anchor:middle;dominant-baseline:middle}
 .moving{filter:url(#glow)}
 @media(prefers-reduced-motion:reduce){.moving animateMotion{display:none}}
 </style>

<path id="ring0" d="M 1105 178 A 505 122 0 1 1 95 178 A 505 122 0 1 1 1105 178 Z"/>
<path id="ring1" d="M 1072 178 A 472 111 4 1 1 128 178 A 472 111 4 1 1 1072 178 Z"/>
<path id="ring2" d="M 1040 178 A 440 99 -4 1 1 160 178 A 440 99 -4 1 1 1040 178 Z"/>
<path id="ring3" d="M 1005 178 A 405 88 3 1 1 195 178 A 405 88 3 1 1 1005 178 Z"/>
